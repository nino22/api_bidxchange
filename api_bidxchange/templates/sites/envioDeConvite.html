<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="http://127.0.0.1:8000/sites/verificando_conta/" method="POST">
        {% csrf_token %}

        <p>
            {{ nomeDonoDaEquipe }} convidou você para participar de
            {{ equipe }} no BidXchange.
        </p>

        <p>
            Seu perfil terá o cargo {{ cargo }}.
            Se ainda não tiver uma conta, você poderá criá-la diretamente pelo convite.
        </p>

        <input type="hidden" name="email" value="{{ emailDoUsuario }}">
        <input type="hidden" name="usuarioEmail" value="{{ usuarioDoTokenEmail }}">
        <input type="hidden" name="token" value="{{ token }}">

        <button type="submit">
            Revisar e aceitar convite →
        </button>
    </form>
</body>
</html>
